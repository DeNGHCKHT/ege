<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЕГЭ Физика: Ежедневный тренажер</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMath()"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 15px;
    }
    .streak-badge {
      background: #ea580c;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
    }
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      margin: 20px 0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
    }
    .task-text {
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: #475569; color: #fff; }
    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }
    .feedback.correct { display: block; background: rgba(34, 197, 94, 0.2); border: 1px solid var(--correct); }
    .feedback.wrong { display: block; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--wrong); }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      gap: 10px;
      margin-top: 20px;
    }
    .stat-box {
      background: var(--card);
      padding: 12px;
      border-radius: 8px;
    }
    .stat-val { font-size: 1.4rem; font-weight: bold; color: var(--accent); }
    .stat-label { font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2 style="margin:0;">ЕГЭ Физика</h2>
      <small style="color:var(--muted)">Ежедневная практика</small>
    </div>
    <div class="streak-badge" id="streakBadge">🔥 0 дней</div>
  </div>

  <div class="card" id="taskCard">
    <div class="meta">
      <span id="taskExamNum">№ --</span>
      <span>•</span>
      <span id="taskTopic">--</span>
    </div>
    <div class="task-text" id="taskText">Загрузка задания...</div>

    <div class="input-row">
      <input type="text" id="userAnswer" placeholder="Ваш ответ" autocomplete="off">
      <button id="submitBtn" onclick="checkAnswer()">Ответить</button>
      <button id="nextBtn" class="btn-secondary" style="display:none;" onclick="loadRandomTask()">Следующая</button>
    </div>

    <div id="feedback" class="feedback"></div>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-val" id="statToday">0/5</div>
      <div class="stat-label">Сегодня решено</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statAccuracy">0%</div>
      <div class="stat-label">Точность</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="statTotal">0</div>
      <div class="stat-label">Всего задач</div>
    </div>
  </div>

  <div style="text-align:center; margin-top:25px;">
    <button class="btn-secondary" style="font-size:0.85rem;" onclick="enableNotifications()">
      🔔 Включить напоминания каждый день
    </button>
  </div>

  <script>
    // Встроенный демо-набор задач (при необходимости подгружается через fetch('tasks.json'))
    const tasks = [
      {
        id: "m1",
        examNumber: 1,
        topic: "Механика (Кинематика)",
        question: "На рисунке график скорости тела. За первые 4 с тело прошло ускорение $$a = 3\\text{ м/с}^2$$. Какую скорость приобрело тело, если $$v_0 = 0$$?",
        answer: "12",
        explanation: "По формуле $$v = v_0 + at = 0 + 3 \\cdot 4 = 12\\text{ м/с}$$."
      },
      {
        id: "m2",
        examNumber: 2,
        topic: "Механика (Динамика)",
        question: "Под действием постоянной силы $$15\\text{ Н}$$ тело движется с ускорением $$3\\text{ м/с}^2$$. Найдите массу тела в кг.",
        answer: "5",
        explanation: "По II закону Ньютона: $$F = ma \\implies m = F / a = 15 / 3 = 5\\text{ кг}$$."
      },
      {
        id: "t7",
        examNumber: 7,
        topic: "Молекулярная физика",
        question: "В сосуде постоянного объема давление неона увеличилось в 2 раза при неизменной массе. Во сколько раз увеличилась температура газа?",
        answer: "2",
        explanation: "По закону Шарля при $$V = \\text{const}$$: $$p_1 / T_1 = p_2 / T_2$$. Давление и температура прямо пропорциональны."
      }
    ];

    let currentTask = null;
    let stats = JSON.parse(localStorage.getItem('ege_physics_stats')) || {
      total: 0,
      correct: 0,
      streak: 0,
      lastDate: null,
      todayCount: 0
    };

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: false}
          ]
        });
      }
    }

    function initStreak() {
      const today = new Date().toISOString().slice(0, 10);
      if (stats.lastDate !== today) {
        // Проверка: вчера или пропущен день?
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        if (stats.lastDate !== yesterday) {
          stats.streak = 0;
        }
        stats.todayCount = 0;
        saveStats();
      }
      updateStatsUI();
    }

    function loadRandomTask() {
      currentTask = tasks[Math.floor(Math.random() * tasks.length)];
      document.getElementById('taskExamNum').innerText = `Задание №${currentTask.examNumber}`;
      document.getElementById('taskTopic').innerText = currentTask.topic;
      document.getElementById('taskText').innerText = currentTask.question;
      document.getElementById('userAnswer').value = '';
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('submitBtn').style.display = 'inline-block';
      document.getElementById('nextBtn').style.display = 'none';
      renderMath();
    }

    function checkAnswer() {
      const input = document.getElementById('userAnswer').value.trim().replace(',', '.');
      if (!input) return;

      const fb = document.getElementById('feedback');
      const isRight = input === currentTask.answer;

      stats.total += 1;
      stats.todayCount += 1;
      if (isRight) {
        stats.correct += 1;
        fb.className = 'feedback correct';
        fb.innerHTML = `<b>Верно!</b><br>${currentTask.explanation}`;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = `<b>Неверно.</b> Правильный ответ: <b>${currentTask.answer}</b>.<br>${currentTask.explanation}`;
      }

      // Обновление даты и ударного режима
      const today = new Date().toISOString().slice(0, 10);
      if (stats.lastDate !== today) {
        stats.streak += 1;
        stats.lastDate = today;
      }

      saveStats();
      updateStatsUI();
      renderMath();

      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function saveStats() {
      localStorage.setItem('ege_physics_stats', JSON.stringify(stats));
    }

    function updateStatsUI() {
      document.getElementById('streakBadge').innerText = `🔥 ${stats.streak} дн.`;
      document.getElementById('statToday').innerText = `${stats.todayCount}/5`;
      document.getElementById('statTotal').innerText = stats.total;
      const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
      document.getElementById('statAccuracy').innerText = `${acc}%`;
    }

    async function enableNotifications() {
      if (!("Notification" in window)) {
        alert("Ваш браузер не поддерживает веб-уведомления.");
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        new Notification("ЕГЭ Физика: Уведомления включены!", {
          body: "Отлично! Каждый день вам будет приходить короткое напоминание прорешать 5 задач."
        });
      }
    }

    initStreak();
    loadRandomTask();
  </script>
</body>
</html>
